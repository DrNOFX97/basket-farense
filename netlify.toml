# Netlify — site estático com uma função para o modo ao vivo.
#
# O build copia app/ e data/ para dist/ e gera a lista de equipas usada pela
# função. Não há bundler no frontend; o que está em app/ é o que é publicado.

[build]
  command = "node scripts/build-static.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# A função responde em /.netlify/functions/live; o cliente pede /api/live,
# tal como no servidor local.
[[redirects]]
  from = "/api/live"
  to = "/.netlify/functions/live"
  status = 200
  force = true

# API de leitura com chave (netlify/functions/api.mjs). Precisa da variável de
# ambiente API_KEYS no projecto Netlify.
[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[headers]]
  for = "/data/farense.json"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
