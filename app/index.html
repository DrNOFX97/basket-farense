<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farense Basket</title>
<meta name="description" content="Calendário, resultados, classificações e estatísticas de todos os escalões de basquetebol do SC Farense.">
<meta name="theme-color" content="#08090B">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Farense Basket">
<meta property="og:title" content="Farense Basket">
<meta property="og:description" content="Calendário, resultados, classificações e estatísticas de todos os escalões de basquetebol do SC Farense.">
<meta property="og:image" content="https://basket-farense.netlify.app/img/emblema.png">
<meta property="og:url" content="https://basket-farense.netlify.app/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" type="image/png" sizes="any" href="/img/emblema.png">
<link rel="apple-touch-icon" href="/img/emblema.png">
</head>
<body>
<a class="skip" href="#conteudo">Saltar para o conteúdo</a>

<div class="app">
  <aside class="sidebar" aria-label="Navegação">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><img src="/img/emblema.png" alt="" width="38" height="38"></div>
      <div class="brand-txt">
        <strong>SC Farense</strong>
        <span>Basquetebol</span>
      </div>
    </div>

    <div class="season" id="season" role="group" aria-label="Época"></div>

    <nav class="nav" id="nav" aria-label="Escalões"></nav>

    <div class="side-foot">
      <a class="live-link" href="#" id="live-link">
        <span class="live-dot" id="live-dot" hidden></span>
        <span id="live-txt">Ao vivo</span>
      </a>
      <p class="foot-note" id="foot-note"></p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="brand brand-sm">
        <div class="brand-mark" aria-hidden="true"><img src="/img/emblema.png" alt="" width="38" height="38"></div>
        <div class="brand-txt"><strong>Farense</strong><span>Basket</span></div>
      </div>
      <div class="mobile-controls">
        <label class="sr-only" for="sel-equipa">Escalão</label>
        <select id="sel-equipa" class="select"></select>
        <label class="sr-only" for="sel-epoca">Época</label>
        <select id="sel-epoca" class="select select-sm"></select>
      </div>
    </header>

    <main class="content" id="conteudo" tabindex="-1"></main>
  </div>
</div>

<div class="erro-fatal" id="erro-fatal" hidden>
  <h1>Não foi possível carregar os dados</h1>
  <p id="erro-msg"></p>
  <p class="mut">Verifica a ligação e tenta de novo. Em local, confirma que o servidor está a correr e que <code>data/farense.json</code> existe.</p>
  <button type="button" class="btn" id="erro-retry">Tentar de novo</button>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
